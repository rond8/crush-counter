name: Android Build

# Builds happen entirely on GitHub's servers — nothing needs to be
# installed locally. Two jobs:
#
#  - debug-apk: runs on every push, no setup required. Produces an
#    installable .apk you can sideload straight onto a phone to test.
#
#  - release-aab: only runs when you trigger it manually (Actions tab
#    -> Android Build -> Run workflow). Produces a signed .aab ready
#    to upload to the Play Store. Requires four repo secrets — see
#    ANDROID.md for how to create them.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env for the build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build web app
        run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: crush-counter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release-aab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env for the build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build web app
        run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync into Android project
        run: npx cap sync android

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Write keystore.properties
        working-directory: android
        run: |
          cat > keystore.properties << EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: crush-counter-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
